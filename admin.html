<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PexPlanner — Administration</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#17212b;
}

.hidden{display:none!important}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 16px 50px;
}

.card{
  background:#fff;
  border:1px solid #dfe5eb;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(16,41,67,.07);
  overflow:hidden;
}

.header{
  background:#102943;
  color:#fff;
  padding:23px 25px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:7px 0 0;
  opacity:.75;
  font-size:14px;
}

.content{padding:24px}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #ccd5dd;
  border-radius:10px;
  background:#fff;
  color:#17212b;
  font:inherit;
}

button{
  font:inherit;
  cursor:pointer;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:700;
}

.primary{
  background:#102943;
  color:#fff;
}

.secondary{
  background:#eef2f5;
  color:#17212b;
}

.danger{
  background:#fff0ee;
  color:#9d3026;
}

.success{
  background:#edf8f1;
  color:#197446;
}

.message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:13px;
}

.message.show{display:block}

.message.error{
  background:#fff0ee;
  border:1px solid #efc4bf;
  color:#9d3026;
}

.message.success{
  background:#edf8f1;
  border:1px solid #bde4ca;
  color:#197446;
}

/* LOGIN */

.login{
  max-width:420px;
  margin:80px auto;
  padding:15px;
}

/* TOP */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.topbar
