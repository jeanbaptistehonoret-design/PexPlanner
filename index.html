<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilotExperience — Réservation</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: transparent;
  color: #17212b;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 10px 10px 25px;
}

.card {
  background: white;
  border: 1px solid transparent;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.07);
  overflow: hidden;
}

.header {
  background: #102943;
  color: white;
  padding: 24px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 7px 0 0;
  opacity: .75;
  font-size: 14px;
}

.content {
  padding: 24px;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.field {
  flex: 1;
  min-width: 220px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

select,
input,
textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #ccd5dd;
  border-radius: 10px;
  background: white;
  color: #17212b;
  font: inherit;
}

textarea {
  resize: vertical;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.calendar-header h2 {
  margin: 0;
  text-transform: capitalize;
  font-size: 18px;
}

.nav {
  display: flex;
  gap: 6px;
}

.nav button {
  width: 38px;
  height: 38px;
  border: 1px solid #dfe5eb;
  background: white;
  border-radius: 9px;
  font-size: 20px;
  cursor: pointer;
}

.nav button:hover {
  background: #f3f6f9;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
}

.weekday {
  text-align: center;
  font-size: 10px;
  color: #6b7785;
  font-weight: 700;
  text-transform: uppercase;
  padding-bottom: 3px;
}

.day {
  min-height: 105px;
  border: 1px solid #dfe5eb;
  border-radius: 11px;
  background: #fbfcfd;
  padding: 7px;
}

.day.empty {
  background: transparent;
  border: 0;
}

.day-number {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.slot {
  width: 100%;
  border: 1px solid #c8d5e0;
  background: #f7fbff;
  border-radius: 8px;
  padding: 8px 7px;
  margin-top: 5px;
  text-align: left;
  cursor: pointer;
  font-size: 11px;
  color: #17212b;
}

.slot:hover {
  border-color: #245f9f;
}

.slot strong {
  display: block;
}

.slot span {
  color: #65717c;
  font-size: 10px;
}

.slot.unavailable {
  background: #eef0f2;
  color: #7d868f;
  border-style: dashed;
  cursor: not-allowed;
}

.status {
  text-align: center;
  color: #6b7785;
  font-size: 12px;
  padding: 15px 0 0;
}

/* =========================
   POPUP
========================= */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(8, 23, 38, .58);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 9999;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 620px;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 18px;
  box-shadow: 0 25px 70px rgba(0,0,0,.25);
}

.modal-header {
  background: #102943;
  color: white;
  padding: 20px;
  position: relative;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.modal-header p {
  margin: 7px 35px 0 0;
  opacity: .75;
  font-size: 13px;
  line-height: 1.5;
}

.close {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 36px;
  height: 36px;
  border: 0;
  background: rgba(255,255,255,.12);
  color: white;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}

.modal-body {
  padding: 21px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.full {
  grid-column: 1 / -1;
}

.submit {
  margin-top: 18px;
}

.submit button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 13px 18px;
  background: #102943;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.submit button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 12px 14px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 13px;
}

.message.success {
  display: block;
  background: #edf8f1;
  border: 1px solid #bfe4cd;
  color: #197446;
}

.message.error {
  display: block;
  background: #fff0ee;
  border: 1px solid #ecc3bd;
  color: #9d3026;
}

/* =========================
   CONFIRMATION
========================= */

.confirmation {
  text-align: center;
  padding: 40px 25px 45px;
}

.confirmation-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.confirmation h2 {
  margin: 0;
  font-size: 22px;
}

.confirmation p {
  color: #6b7785;
  line-height: 1.6;
}

.confirmation .details {
  margin: 20px 0;
  padding: 15px;
  border: 1px solid #dfe5eb;
  background: #f6f8fa;
  border-radius: 11px;
  text-align: left;
  font-size: 13px;
}

.confirmation button {
  border: 0;
  background: #102943;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
}

@media(max-width: 700px) {

  .container {
    padding: 5px 5px 20px;
  }

  .content {
    padding: 15px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .calendar {
    gap: 4px;
  }

  .day {
    min-height: 82px;
    padding: 5px;
  }

  .slot {
    padding: 6px 5px;
  }

  .slot span {
    display: none;
  }

  .weekday {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">
      <h1>PilotExperience</h1>
      <p>Réservez votre séance</p>
    </div>

    <div class="content">

      <div class="controls">

        <div class="field">
          <label for="sessionType">
            Type de séance
          </label>

          <select id="sessionType">
            <option value="">
              Chargement...
            </option>
          </select>
        </div>

        <div class="field">
          <label for="month">
            Mois
          </label>

          <input
            type="month"
            id="month"
          >
        </div>

      </div>

      <div class="calendar-header">

        <h2 id="monthTitle"></h2>

        <div class="nav">

          <button
            type="button"
            onclick="changeMonth(-1)"
            aria-label="Mois précédent"
          >
            ‹
          </button>

          <button
            type="button"
            onclick="changeMonth(1)"
            aria-label="Mois suivant"
          >
            ›
          </button>

        </div>

      </div>

      <div id="calendar" class="calendar"></div>

      <div id="status" class="status">
        Chargement du planning...
      </div>

    </div>

  </div>

</div>


<!-- =========================
     POPUP RESERVATION
========================= -->

<div id="bookingModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <button
        class="close"
        type="button"
        onclick="closeBookingModal()"
      >
        ×
      </button>

      <h2>
        Réserver votre séance
      </h2>

      <p id="selectedSlotInfo"></p>

    </div>

    <div
      id="formContainer"
      class="modal-body"
    >

      <div
        id="message"
        class="message"
      ></div>

      <form id="bookingForm">

        <div class="form-grid">

          <div>
            <label for="firstName">
              Prénom *
            </label>

            <input
              id="firstName"
              required
            >
          </div>

          <div>
            <label for="lastName">
              Nom *
            </label>

            <input
              id="lastName"
              required
            >
          </div>

          <div>
            <label for="email">
              E-mail *
            </label>

            <input
              id="email"
              type="email"
              required
            >
          </div>

          <div>
            <label for="phone">
              Téléphone *
            </label>

            <input
              id="phone"
              type="tel"
              required
            >
          </div>

          <div>
            <label for="ticket">
              Numéro de billet *
            </label>

            <input
              id="ticket"
              required
              placeholder="Ex. PE-123456"
            >
          </div>

          <div>
            <label for="participants">
              Participants
            </label>

            <select id="participants">

              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>

            </select>
          </div>

          <div class="full">

            <label for="comment">
              Commentaire
            </label>

            <textarea
              id="comment"
              rows="3"
            ></textarea>

          </div>

        </div>

        <div class="submit">

          <button
            id="submitButton"
            type="submit"
          >
            Confirmer ma réservation
          </button>

        </div>

      </form>

    </div>

    <div
      id="confirmation"
      class="confirmation"
      style="display:none"
    >

      <div class="confirmation-icon">
        ✓
      </div>

      <h2>
        Réservation confirmée
      </h2>

      <p>
        Votre créneau a bien été réservé.
      </p>

      <div
        id="confirmationDetails"
        class="details"
      ></div>

      <button
        type="button"
        onclick="closeBookingModal()"
      >
        Fermer
      </button>

    </div>

  </div>

</div>


<script>

const API = "/api";

let slots = [];
let sessions = [];
let selectedSlot = null;


/* =====================================================
   OUTILS
===================================================== */

function pad(number) {

  return String(number)
    .padStart(2, "0");

}


function formatDate(date) {

  return new Date(
    date + "T12:00:00"
  ).toLocaleDateString(
    "fr-FR",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


function duration(minutes) {

  if (minutes === 45)
    return "45 min";

  if (minutes === 60)
    return "1h";

  if (minutes === 90)
    return "1h30";

  if (minutes === 180)
    return "3h";

  return minutes + " min";

}


/* =====================================================
   CHANGEMENT DE MOIS
===================================================== */

function changeMonth(direction) {

  const monthInput =
    document.getElementById("month");

  if (!monthInput.value) {

    const today = new Date();

    monthInput.value =
      today.getFullYear() +
      "-" +
      pad(today.getMonth() + 1);

  }


  const [
    year,
    month
  ] =
    monthInput.value
      .split("-")
      .map(Number);


  const date =
    new Date(
      year,
      month - 1 + direction,
      1
    );


  monthInput.value =
    date.getFullYear() +
    "-" +
    pad(date.getMonth() + 1);


  renderCalendar();

}


/* =====================================================
   CHARGER LE PLANNING
===================================================== */

async function loadPlanning() {

  const status =
    document.getElementById("status");

  status.textContent =
    "Chargement du planning...";


  try {

    const response =
      await fetch(
        API + "/slots",
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Impossible de charger le planning."
      );

    }


    slots =
      await response.json();


    sessions = [];


    slots.forEach(slot => {

      if (
        slot.sessions &&
        !sessions.some(
          session =>
            session.id ===
            slot.sessions.id
        )
      ) {

        sessions.push(
          slot.sessions
        );

      }

    });


    const select =
      document.getElementById(
        "sessionType"
      );


    select.innerHTML = "";


    if (!sessions.length) {

      select.innerHTML =
        `<option value="">
          Aucun pack disponible
        </option>`;

      status.textContent =
        "Aucune disponibilité pour le moment.";

      renderCalendar();

      return;

    }


    sessions.forEach(session => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        session.id;

      option.textContent =
        session.name;

      select.appendChild(
        option
      );

    });


    renderCalendar();


  } catch (error) {

    console.error(error);

    status.textContent =
      "Le planning est momentanément indisponible.";

  }

}


/* =====================================================
   CALENDRIER
===================================================== */

function renderCalendar() {

  const month =
    document.getElementById(
      "month"
    ).value;


  if (!month) return;


  const [
    year,
    monthNumber
  ] =
    month
      .split("-")
      .map(Number);


  const first =
    new Date(
      year,
      monthNumber - 1,
      1
    );


  const days =
    new Date(
      year,
      monthNumber,
      0
    ).getDate();


  const offset =
    (first.getDay() + 6) % 7;


  document.getElementById(
    "monthTitle"
  ).textContent =
    first.toLocaleDateString(
      "fr-FR",
      {
        month: "long",
        year: "numeric"
      }
    );


  const calendar =
    document.getElementById(
      "calendar"
    );


  calendar.innerHTML = "";


  [
    "Lun",
    "Mar",
    "Mer",
    "Jeu",
    "Ven",
    "Sam",
    "Dim"
  ].forEach(day => {

    const el =
      document.createElement(
        "div"
      );

    el.className =
      "weekday";

    el.textContent =
      day;

    calendar.appendChild(
      el
    );

  });


  for (
    let i = 0;
    i < offset;
    i++
  ) {

    const el =
      document.createElement(
        "div"
      );

    el.className =
      "day empty";

    calendar.appendChild(
      el
    );

  }


  const selectedSession =
    document.getElementById(
      "sessionType"
    ).value;


  for (
    let day = 1;
    day <= days;
    day++
  ) {

    const date =
      year +
      "-" +
      pad(monthNumber) +
      "-" +
      pad(day);


    const dayElement =
      document.createElement(
        "div"
      );

    dayElement.className =
      "day";


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "day-number";

    number.textContent =
      day;

    dayElement.appendChild(
      number
    );


    slots
      .filter(slot => {

        return (
          slot.date === date &&
          slot.session_id ===
            selectedSession
        );

      })
      .sort((a,b) =>
        a.time.localeCompare(
          b.time
        )
      )
      .forEach(slot => {

        const button =
          document.createElement(
            "button"
          );


        const unavailable =
          slot.status !==
          "available";


        button.type =
          "button";


        button.className =
          "slot" +
          (
            unavailable
              ? " unavailable"
              : ""
          );


        const session =
          slot.sessions;


        button.innerHTML =
          `<strong>
             ${slot.time.substring(0,5)}
             ·
             ${duration(session.duration)}
           </strong>
           <span>
             ${
               unavailable
                 ? "Indisponible"
                 : "Disponible"
             }
           </span>`;


        if (!unavailable) {

          button.onclick =
            () => openBookingModal(slot);

        }


        dayElement.appendChild(
          button
        );

      });


    calendar.appendChild(
      dayElement
    );

  }


  const hasSlots =
    slots.some(slot =>
      slot.date.startsWith(month) &&
      slot.session_id ===
        selectedSession
    );


  document.getElementById(
    "status"
  ).textContent =
    hasSlots
      ? ""
      : "Aucun créneau disponible pour ce mois.";

}


/* =====================================================
   OUVRIR LE POPUP
===================================================== */

function openBookingModal(slot) {

  selectedSlot =
    slot;


  const session =
    slot.sessions;


  document.getElementById(
    "selectedSlotInfo"
  ).innerHTML =

    `<strong>
      ${session.name}
    </strong>
    <br>
    ${formatDate(slot.date)}
    à ${slot.time.substring(0,5)}
    <br>
    Durée :
    ${duration(session.duration)}`;


  document.getElementById(
    "bookingModal"
  ).classList.add(
    "show"
  );


  document.getElementById(
    "formContainer"
  ).style.display =
    "block";


  document.getElementById(
    "confirmation"
  ).style.display =
    "none";


  document.getElementById(
    "bookingForm"
  ).reset();


  hideMessage();

}


function closeBookingModal() {

  document.getElementById(
    "bookingModal"
  ).classList.remove(
    "show"
  );


  selectedSlot =
    null;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
) {

  const element =
    document.getElementById(
      "message"
    );


  element.className =
    "message " + type;


  element.textContent =
    text;

}


function hideMessage() {

  const element =
    document.getElementById(
      "message"
    );


  element.className =
    "message";


  element.textContent =
    "";

}


/* =====================================================
   RESERVATION
===================================================== */

document
  .getElementById(
    "bookingForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!selectedSlot) {

        showMessage(
          "Veuillez sélectionner un créneau.",
          "error"
        );

        return;

      }


      const button =
        document.getElementById(
          "submitButton"
        );


      button.disabled =
        true;


      button.textContent =
        "Réservation en cours...";


      const bookingData = {

        slotId:
          selectedSlot.id,

        firstName:
          document.getElementById(
            "firstName"
          ).value.trim(),

        lastName:
          document.getElementById(
            "lastName"
          ).value.trim(),

        email:
          document.getElementById(
            "email"
          ).value.trim(),

        phone:
          document.getElementById(
            "phone"
          ).value.trim(),

        ticket:
          document.getElementById(
            "ticket"
          ).value.trim(),

        participants:
          Number(
            document.getElementById(
              "participants"
            ).value
          ),

        comment:
          document.getElementById(
            "comment"
          ).value.trim()

      };


      try {

        const response =
          await fetch(
            API + "/booking",
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  bookingData
                )

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "La réservation n'a pas pu être enregistrée."
          );

        }


        const session =
          selectedSlot.sessions;


        document.getElementById(
          "formContainer"
        ).style.display =
          "none";


        document.getElementById(
          "confirmation"
        ).style.display =
          "block";


        document.getElementById(
          "confirmationDetails"
        ).innerHTML =

          `<strong>
             ${session.name}
           </strong>
           <br><br>
           ${formatDate(
             selectedSlot.date
           )}
           à
           ${selectedSlot.time.substring(0,5)}
           <br>
           Durée :
           ${duration(
             session.duration
           )}
           <br><br>
           Billet :
           <strong>
             ${bookingData.ticket}
           </strong>`;


        selectedSlot =
          null;


        await loadPlanning();


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

      }


      button.disabled =
        false;


      button.textContent =
        "Confirmer ma réservation";

    }
  );


/* =====================================================
   CONTROLES
===================================================== */

document
  .getElementById(
    "sessionType"
  )
  .addEventListener(
    "change",
    renderCalendar
  );


document
  .getElementById(
    "month"
  )
  .addEventListener(
    "change",
    renderCalendar
  );


/* =====================================================
   FERMETURE POPUP
===================================================== */

document
  .getElementById(
    "bookingModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeBookingModal();

      }

    }
  );


/* =====================================================
   DEMARRAGE
===================================================== */

const today =
  new Date();


document.getElementById(
  "month"
).value =

  today.getFullYear() +
  "-" +
  pad(
    today.getMonth() + 1
  );


loadPlanning();

</script>

</body>
</html>
