<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test PexPlanner</title>
</head>
<body>

<h2>Test réservation PexPlanner</h2>

<button onclick="testBooking()">Tester</button>

<pre id="result"></pre>

<script>
async function testBooking() {

  const data = {
    slotId: "2c2208eb-8bb5-4e99-b964-e978b908d515",
    firstName: "Jean",
    lastName: "Test",
    email: "test@pilotexperience.fr",
    phone: "0600000000",
    ticket: "TEST-001",
    participants: 1,
    comment: "Test PexPlanner"
  };

  try {

    const response = await fetch(
      "https://pex-planner-hj6xfwnoq-hove1.vercel.app/api/booking",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();

    document.getElementById("result").textContent =
      JSON.stringify(result, null, 2);

  } catch (error) {

    document.getElementById("result").textContent =
      error.toString();

  }
}
</script>

</body>
</html>
